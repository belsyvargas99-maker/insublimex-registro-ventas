# Se levanta junto a n8n en el mismo VPS. Ajusta la red/proxy según lo que ya exista
# (Traefik, Caddy o Nginx Proxy Manager). El servicio escucha en el puerto 3000 interno.
services:
  ventas:
    build: .
    container_name: insublimex-ventas
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./service-account.json:/app/service-account.json:ro
      - ventas-data:/app/data
      - ventas-uploads:/app/uploads
    ports:
      - "127.0.0.1:3010:3000"

volumes:
  ventas-data:
  ventas-uploads:
